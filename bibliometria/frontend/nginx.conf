server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El clustering y el benchmark pueden tardar varios segundos.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 180s;
    }

    # Las rutas de Angular (/busqueda, /corpus...) las resuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
