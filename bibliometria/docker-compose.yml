# Orquesta backend y frontend. Uso: docker compose up -d --build
# La aplicación queda en http://localhost; el frontend reenvía /api al backend.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - CORPUS_PATH=/app/data/corpus
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
